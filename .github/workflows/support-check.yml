name: web toy checks

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test support.test.mjs analytics.test.mjs tracking-routes.test.mjs millionaire/core.test.mjs millionaire/countries.test.mjs millionaire/map.test.mjs millionaire/ui.test.mjs millionaire/currency-flags.test.mjs
