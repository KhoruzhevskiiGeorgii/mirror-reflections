name: support check

on:
  push:
    branches:
      - feature/unified-support
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test support.test.mjs millionaire/core.test.mjs millionaire/countries.test.mjs
